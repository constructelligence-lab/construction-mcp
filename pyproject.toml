[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-mcp"
version = "0.5.0"
description = "Offline MCP server with construction reference data, calculators and project records: cost codes, glossary, waste factors, CPM, pay applications, change orders, quantities, and validating and tracing records in the construction schema."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code), CC BY 4.0 (data and documentation)" }
authors = [{ name = "Constructelligence" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "construction", "construction-management", "estimating", "critical-path", "cpm", "earned-value", "pay-application", "change-orders", "cost-codes", "claude", "ai-agents", "aec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Natural Language :: English",
]
dependencies = []

[project.urls]
Homepage = "https://constructelligence.co"
Repository = "https://github.com/constructelligence-lab/construction-mcp"
Issues = "https://github.com/constructelligence-lab/construction-mcp/issues"
Revit = "https://github.com/constructelligence-lab/revit-mcp"
Data = "https://github.com/constructelligence-lab/construction-data"
Schema = "https://github.com/constructelligence-lab/construction-schema"

[project.scripts]
construction-mcp = "construction_mcp.__main__:main"

[tool.setuptools]
packages = ["construction_mcp", "construction_mcp.cschema"]

[tool.setuptools.package-data]
construction_mcp = ["data/*.csv", "data/*.md"]
"construction_mcp.cschema" = ["schema/*.csv", "*.md"]
